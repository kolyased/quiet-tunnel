services:
  backend:
    build: ./backend
    env_file: .env
    restart: unless-stopped
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 256m
    cpus: 0.50
    networks: [quiet]
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers", "--forwarded-allow-ips", "172.30.0.10"]
    logging: {driver: json-file, options: {max-size: "5m", max-file: "3"}}
  frontend:
    build: ./frontend
    environment:
      BACKEND_INTERNAL_URL: http://backend:8000
    restart: unless-stopped
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    tmpfs: [/tmp]
    mem_limit: 384m
    cpus: 0.75
    networks: [quiet]
    depends_on:
      backend: {condition: service_healthy}
    logging: {driver: json-file, options: {max-size: "5m", max-file: "3"}}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
  nginx:
    image: nginx:1.28-alpine
    restart: unless-stopped
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID]
    tmpfs: [/var/cache/nginx, /var/run]
    ports: ["127.0.0.1:18080:8080"]
    volumes:
      - ./deploy/nginx/app.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      quiet:
        ipv4_address: 172.30.0.10
      ingress: {}
    depends_on:
      frontend: {condition: service_healthy}
      backend: {condition: service_healthy}
    logging: {driver: json-file, options: {max-size: "5m", max-file: "3"}}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
networks:
  quiet:
    name: quiet-tunnel
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.30.0.0/24

  ingress:
    name: quiet-tunnel-ingress
    driver: bridge
